# Supabase CLI ayarları. GitHub Actions bu klasördeki veritabanı değişikliklerini (migrations)
# ve sunucu fonksiyonlarını (functions) Supabase projesine yükler.
project_id = "langirt-lig"

# Fonksiyonlar oturumu kendi içinde doğrular (yeni Supabase anahtar sistemiyle uyumlu)
[functions.create-match]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

[functions.notify]
verify_jwt = false
