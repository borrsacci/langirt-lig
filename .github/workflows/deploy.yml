# main dalına her gönderimde: testler → Supabase (veritabanı + fonksiyonlar) → APK
# Gerekli GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  : supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF   : proje adresindeki kimlik (https://<BU>.supabase.co)
#   SUPABASE_DB_PASSWORD   : proje oluştururken belirlenen veritabanı şifresi
# İsteğe bağlı (yoksa CLI ile otomatik alınır): SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# iPhone için web sürümü (isteğe bağlı): CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          PGTEST_HOST: localhost
          PGTEST_PORT: 5432

  backend:
    name: Supabase
    needs: test
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Ayarları kontrol et
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$REF" ]; then
            echo "::warning::Supabase secret'ları eksik (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD). Sunucu yüklenmedi; APK sunucusuz test derlemesi olarak üretilecek."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: 3.4.0
      - name: Projeye bağlan
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref "$REF"
      - name: Veritabanını güncelle
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --remote --yes
      - name: Sunucu fonksiyonlarını yükle
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy --project-ref "$REF" --yes
      - name: Android bildirim anahtarını sunucuya aktar
        if: steps.check.outputs.configured == 'true'
        env:
          FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FSA" ]; then echo "::warning::FIREBASE_SERVICE_ACCOUNT yok; Android bildirimleri gönderilemez."; exit 0; fi
          COMPACT=$(echo "$FSA" | jq -c . ) || { echo "::error::FIREBASE_SERVICE_ACCOUNT geçerli bir JSON değil"; exit 1; }
          supabase secrets set --project-ref "$REF" --yes FIREBASE_SERVICE_ACCOUNT="$COMPACT"

  android:
    name: APK
    needs: backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100 # yeni sürüm kontrolü için uygulama kodunun son değişikliği gerekir
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: supabase/setup-cli@v1
        if: needs.backend.outputs.configured == 'true'
        with:
          version: 3.4.0
      - name: API anahtarları
        if: needs.backend.outputs.configured == 'true'
        env:
          ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$ANON_SECRET" ] || [ -z "$SERVICE_SECRET" ]; then
            KEYS=$(supabase projects api-keys --project-ref "$REF" -o json)
            ANON=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon") | .api_key')
            SERVICE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key')
          else
            ANON="$ANON_SECRET"; SERVICE="$SERVICE_SECRET"
          fi
          if [ -z "$ANON" ] || [ "$ANON" = "null" ] || [ -z "$SERVICE" ] || [ "$SERVICE" = "null" ]; then
            echo "::error::API anahtarları alınamadı. SUPABASE_ANON_KEY ve SUPABASE_SERVICE_ROLE_KEY secret'larını ekleyin."; exit 1
          fi
          echo "::add-mask::$ANON"; echo "::add-mask::$SERVICE"
          echo "ANON=$ANON" >> "$GITHUB_ENV"; echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Firebase (Android bildirimleri)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::warning::GOOGLE_SERVICES_JSON yok; APK bildirimsiz derlenecek."; exit 0; fi
          echo "$GSJ" | jq . > android/app/google-services.json || { echo "::error::GOOGLE_SERVICES_JSON geçerli bir JSON değil"; exit 1; }
          if ! jq -e '.client[].client_info.android_client_info.package_name | select(. == "com.langirt.lig")' android/app/google-services.json >/dev/null; then
            echo "::error::google-services.json içinde com.langirt.lig paketi yok (Firebase'e Android uygulaması bu adla eklenmeli)"; exit 1
          fi
          echo "VITE_FCM=1" >> "$GITHUB_ENV"
      - name: Web uygulamasını derle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ needs.backend.outputs.configured == 'true' && format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_REF) || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON }}
          APP_VERSION: ${{ github.run_number }}
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../langirt-ligi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: langirt-ligi-apk
          path: langirt-ligi.apk
      - name: APK'yı herkese açık linke yükle
        if: needs.backend.outputs.configured == 'true'
        run: |
          BASE="https://$REF.supabase.co/storage/v1/object"
          # Sadece uygulamanın kendisi değiştiyse yeni sürüm yayınla (CI/test değişiklikleri telefonlara "yeni sürüm" demesin)
          APP_COMMIT=$(git log -1 --format=%H -- src public index.html android supabase/functions/_shared package.json package-lock.json capacitor.config.ts vite.config.ts)
          PUBLISHED=$(curl -fsS "$BASE/public/app/version.json?t=$(date +%s)" | jq -r '.commit // empty' || true)
          if [ "$APP_COMMIT" = "$PUBLISHED" ]; then
            echo "Uygulama kodu değişmedi ($APP_COMMIT); yeni sürüm yayınlanmadı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "$BASE/app/langirt-ligi.apk" \
            -H "Authorization: Bearer $SERVICE" -H "apikey: $SERVICE" -H "x-upsert: true" \
            -H "cache-control: max-age=60" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @langirt-ligi.apk
          printf '{"version": %s, "url": "%s/public/app/langirt-ligi.apk?v=%s", "commit": "%s"}' "${{ github.run_number }}" "$BASE" "${{ github.run_number }}" "$APP_COMMIT" > version.json
          curl -fsS -X POST "$BASE/app/version.json" \
            -H "Authorization: Bearer $SERVICE" -H "apikey: $SERVICE" -H "x-upsert: true" \
            -H "cache-control: max-age=30" -H "Content-Type: application/json" \
            --data-binary @version.json
          echo "### İndirme linki" >> "$GITHUB_STEP_SUMMARY"
          echo "$BASE/public/app/langirt-ligi.apk" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web (iPhone)
    needs: backend
    if: needs.backend.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Ayarları kontrol et
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secret'ları eksik (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Web sürümü yayınlanmadı."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: 3.4.0
      - name: API anahtarı
        if: steps.check.outputs.ok == 'true'
        env:
          ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ANON="$ANON_SECRET"
          if [ -z "$ANON" ]; then
            ANON=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="anon") | .api_key')
          fi
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then echo "::error::Anon anahtarı alınamadı"; exit 1; fi
          echo "::add-mask::$ANON"
          echo "ANON=$ANON" >> "$GITHUB_ENV"
      - if: steps.check.outputs.ok == 'true'
        run: npm ci
      - name: Web uygulamasını derle
        if: steps.check.outputs.ok == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON }}
      - name: Cloudflare Pages'e yayınla
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 pages project list 2>&1 | grep -q "langirt-lig"; then
            npx --yes wrangler@4 pages project create langirt-lig --production-branch main
          fi
          npx --yes wrangler@4 pages deploy dist --project-name langirt-lig --branch main --commit-dirty=true | tee deploy.log
          echo "### iPhone / web adresi" >> "$GITHUB_STEP_SUMMARY"
          echo "Kalıcı adres: https://langirt-lig.pages.dev (proje adı alınmışsa Cloudflare panelindeki adres)" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'https://[^ ]*pages.dev' deploy.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Yedek adres (workers.dev)
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          # Bazı internet sağlayıcıları pages.dev'i engelleyebiliyor; aynı site workers.dev'de de yayınlanır
          npx --yes wrangler@4 deploy --name langirt-lig --assets dist --compatibility-date 2026-11-01 | tee workers.log
          grep -o 'https://[^ ]*workers.dev' workers.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
