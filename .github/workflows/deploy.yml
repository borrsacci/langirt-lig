# main dalına her gönderimde: testler → Supabase (veritabanı + fonksiyonlar) → APK
# Gerekli GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  : supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF   : proje adresindeki kimlik (https://<BU>.supabase.co)
#   SUPABASE_DB_PASSWORD   : proje oluştururken belirlenen veritabanı şifresi
# İsteğe bağlı (yoksa CLI ile otomatik alınır): SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          PGTEST_HOST: localhost
          PGTEST_PORT: 5432

  backend:
    name: Supabase
    needs: test
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Ayarları kontrol et
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$REF" ]; then
            echo "::warning::Supabase secret'ları eksik (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD). Sunucu yüklenmedi; APK sunucusuz test derlemesi olarak üretilecek."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: 3.4.0
      - name: Projeye bağlan
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref "$REF"
      - name: Veritabanını güncelle
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --remote --yes
      - name: Sunucu fonksiyonlarını yükle
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy --project-ref "$REF" --yes

  android:
    name: APK
    needs: backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: supabase/setup-cli@v1
        if: needs.backend.outputs.configured == 'true'
        with:
          version: 3.4.0
      - name: API anahtarları
        if: needs.backend.outputs.configured == 'true'
        env:
          ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$ANON_SECRET" ] || [ -z "$SERVICE_SECRET" ]; then
            KEYS=$(supabase projects api-keys --project-ref "$REF" -o json)
            ANON=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon") | .api_key')
            SERVICE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key')
          else
            ANON="$ANON_SECRET"; SERVICE="$SERVICE_SECRET"
          fi
          if [ -z "$ANON" ] || [ "$ANON" = "null" ] || [ -z "$SERVICE" ] || [ "$SERVICE" = "null" ]; then
            echo "::error::API anahtarları alınamadı. SUPABASE_ANON_KEY ve SUPABASE_SERVICE_ROLE_KEY secret'larını ekleyin."; exit 1
          fi
          echo "::add-mask::$ANON"; echo "::add-mask::$SERVICE"
          echo "ANON=$ANON" >> "$GITHUB_ENV"; echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Web uygulamasını derle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ needs.backend.outputs.configured == 'true' && format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_REF) || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON }}
          APP_VERSION: ${{ github.run_number }}
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../langirt-ligi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: langirt-ligi-apk
          path: langirt-ligi.apk
      - name: APK'yı herkese açık linke yükle
        if: needs.backend.outputs.configured == 'true'
        run: |
          BASE="https://$REF.supabase.co/storage/v1/object"
          curl -fsS -X POST "$BASE/app/langirt-ligi.apk" \
            -H "Authorization: Bearer $SERVICE" -H "apikey: $SERVICE" -H "x-upsert: true" \
            -H "cache-control: max-age=60" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @langirt-ligi.apk
          printf '{"version": %s, "url": "%s/public/app/langirt-ligi.apk?v=%s"}' "${{ github.run_number }}" "$BASE" "${{ github.run_number }}" > version.json
          curl -fsS -X POST "$BASE/app/version.json" \
            -H "Authorization: Bearer $SERVICE" -H "apikey: $SERVICE" -H "x-upsert: true" \
            -H "cache-control: max-age=30" -H "Content-Type: application/json" \
            --data-binary @version.json
          echo "### İndirme linki" >> "$GITHUB_STEP_SUMMARY"
          echo "$BASE/public/app/langirt-ligi.apk" >> "$GITHUB_STEP_SUMMARY"
